services:
  - type: web
    name: rms10-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://rms10-web.web.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
